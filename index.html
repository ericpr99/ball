<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>無人機足球記分板</title>
  <style>
    :root{
      --bg:#0b0b0b;
      --panel:#111;
      --accent:#161616;
      --red:#d33b3b;
      --blue:#2f9cff;
      --muted:rgba(255,255,255,0.08);
      --icon-size:22px;
      --gap:16px;
      --max-width:1200px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
      background:var(--bg);
      color:#fff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      flex-direction:column;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    /* Header */
    header{
      width:100%;
      max-width:var(--max-width);
      text-align:center;
      padding:12px 8px;
      font-size:22px;
      font-weight:700;
      color:#fff;
      margin-bottom:12px;
    }

    /* Container */
    .container{
      width:100%;
      max-width:var(--max-width);
      display:flex;
      flex-direction:column;
      gap:var(--gap);
    }

    /* Top bar: centered timer + wins */
    .top-bar-wrap{
      display:flex;
      justify-content:center;
      width:100%;
    }
    .top-bar{
      display:flex;
      align-items:center;
      gap:20px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      padding:12px 18px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.03);
      width:100%;
      max-width:920px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .timer-block{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      min-width:120px;
    }
    #timer{
      font-size:48px;
      padding:6px 12px;
      border-radius:8px;
      background:rgba(255,255,255,0.02);
      border:1px solid var(--muted);
      min-width:100px;
      text-align:center;
    }
    .wins{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:6px;
      line-height:1.1;
    }
    .wins .row{ font-weight:600; font-size:16px; }
    .wins .value{ font-weight:800; font-size:18px; margin-left:6px; }

    /* Scoreboard: two panels side-by-side, never wrap */
    .scoreboard{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      width:100%;
      flex-wrap:nowrap; /* 不折行 */
    }
    .team{
      flex:1 1 0;
      border-radius:12px;
      padding:18px;
      cursor:pointer;
      user-select:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      transition:transform .12s ease, box-shadow .12s ease;
      min-height:220px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      overflow:hidden;
    }
    .team:active{ transform:scale(.995) }
    .team:hover{ box-shadow:0 12px 36px rgba(0,0,0,0.7) }
    .team h2{ margin:0; font-size:20px; font-weight:700; color:#fff; }
    .circle{
      width:150px;
      height:150px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:64px;
      margin:18px 0;
      background:rgba(0,0,0,0.12);
      border:2px solid rgba(255,255,255,0.04);
    }
    .team.red{ background: linear-gradient(180deg, rgba(211,59,59,0.95), rgba(180,30,30,0.9)); }
    .team.blue{ background: linear-gradient(180deg, rgba(47,156,255,0.95), rgba(20,110,220,0.9)); }

    /* Controls: allow wrapping and responsive layout */
    .controls{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;        /* 允許折行 */
      padding:12px;
      background:var(--accent);
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.03);
    }
    .controls-row{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
    }
    .controls button{
      flex:0 1 auto;         /* 可縮放但不強制換行 */
      white-space:nowrap;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      min-width:56px;
      height:56px;
      padding:8px 12px;
      border-radius:10px;
      border:none;
      background:transparent;
      color:#fff;
      cursor:pointer;
      transition:transform .08s ease, background .12s ease;
    }
    .controls button:hover{ transform:translateY(-4px); background:rgba(255,255,255,0.03); }

    .controls .icon{ width:var(--icon-size); height:var(--icon-size); fill:#fff; }

    /* Colored penalty buttons */
    .penalty-red{
      background: linear-gradient(180deg, rgba(211,59,59,0.98), rgba(180,30,30,0.9));
      box-shadow: 0 8px 20px rgba(211,59,59,0.12);
    }
    .penalty-blue{
      background: linear-gradient(180deg, rgba(47,156,255,0.98), rgba(20,110,220,0.9));
      box-shadow: 0 8px 20px rgba(47,156,255,0.12);
    }

    /* Small screen adjustments */
    @media (max-width:1000px){
      #timer{ font-size:40px; }
      .circle{ width:130px; height:130px; font-size:56px; }
      .team{ min-height:200px; padding:14px; }
    }
    @media (max-width:700px){
      #timer{ font-size:34px; }
      .circle{ width:110px; height:110px; font-size:44px; }
      .team{ min-height:170px; padding:12px; }
      .controls button{ min-width:48px; height:48px; padding:6px 8px; }
    }
    @media (max-width:420px){
      #timer{ font-size:28px; }
      .circle{ width:86px; height:86px; font-size:34px; }
      .team h2{ font-size:16px; }
    }

    /* Accessibility focus */
    .team:focus{ outline:3px solid rgba(255,255,255,0.08); outline-offset:4px; }
    .controls button:focus{ outline:2px solid rgba(255,255,255,0.06); outline-offset:2px; }
  </style>
</head>
<body>
  <header>無人機足球記分板</header>

  <div class="container" role="main">
    <div class="top-bar-wrap">
      <div class="top-bar" role="region" aria-label="計時與勝局">
        <div class="timer-block" aria-hidden="false">
          <div id="timer" aria-live="polite">00:00</div>
        </div>

        <div class="wins" aria-live="polite">
          <div class="row">紅隊勝局: <span id="redWins" class="value">0</span></div>
          <div class="row">藍隊勝局: <span id="blueWins" class="value">0</span></div>
        </div>
      </div>
    </div>

    <section class="scoreboard" aria-label="記分板">
      <div class="team red" id="redPanel" role="button" tabindex="0" aria-label="紅隊 加分">
        <h2>紅隊</h2>
        <div class="circle" id="redScore" aria-live="polite">0</div>
      </div>

      <div class="team blue" id="bluePanel" role="button" tabindex="0" aria-label="藍隊 加分">
        <h2>藍隊</h2>
        <div class="circle" id="blueScore" aria-live="polite">0</div>
      </div>
    </section>

    <nav class="controls" aria-label="控制列">
      <!-- group 1 -->
      <div class="controls-row" role="group" aria-label="主要控制">
        <button id="btnStart" title="開始比賽" aria-label="開始比賽">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button id="btnStop" title="結束場次" aria-label="結束場次">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
        </button>

        <button id="btnResetTotals" title="勝局歸零" aria-label="勝局歸零">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6V3L8 7l4 4V8c2.8 0 5 2.2 5 5 0 .6-.1 1.2-.3 1.8l1.6 1.1C18.9 15 19 14.5 19 14c0-3.9-3.1-7-7-7zM6.3 6.2L4.7 5.1C5.1 4.1 6 3.3 7.1 3c.6-.1 1.2 0 1.7.2L8.2 4.9C7.6 4.8 7 4.9 6.6 5.3 6.2 5.7 6.1 6.1 6.3 6.2zM6 12c0-.6.1-1.2.3-1.8L4.7 9.1C4.1 10 4 11 4 12c0 3.9 3.1 7 7 7v3l4-4-4-4v3c-2.8 0-5-2.2-5-5z"/></svg>
        </button>
      </div>

      <!-- group 2 -->
      <div class="controls-row" role="group" aria-label="罰球與重置">
        <button id="btnPenaltyRed" class="penalty-red" title="紅隊罰球" aria-label="紅隊罰球">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3H4c-1.1 0-2 .9-2 2v2c0 .6.4 1 1 1h1v6c0 1.7 1.3 3 3 3h8c1.7 0 3-1.3 3-3V6h1c.6 0 1-.4 1-1V4c0-1.1-.9-2-2-2zM6 8H5V6h1v2zm12 7c0 .6-.4 1-1 1H8c-.6 0-1-.4-1-1V9h11v6z"/></svg>
        </button>

        <button id="btnPenaltyBlue" class="penalty-blue" title="藍隊罰球" aria-label="藍隊罰球">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3H4c-1.1 0-2 .9-2 2v2c0 .6.4 1 1 1h1v6c0 1.7 1.3 3 3 3h8c1.7 0 3-1.3 3-3V6h1c.6 0 1-.4 1-1V4c0-1.1-.9-2-2-2zM6 8H5V6h1v2zm12 7c0 .6-.4 1-1 1H8c-.6 0-1-.4-1-1V9h11v6z"/></svg>
        </button>

        <button id="btnResetRed" title="紅隊歸零" aria-label="紅隊歸零">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </button>

        <button id="btnResetBlue" title="藍隊歸零" aria-label="藍隊歸零">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </button>
      </div>

      <!-- group 3 -->
      <div class="controls-row" role="group" aria-label="其他">
        <button id="btnSettings" title="設定" aria-label="設定">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54A.5.5 0 0013.5 2h-3a.5.5 0 00-.49.42l-.36 2.54c-.57.23-1.1.54-1.62.94l-2.39-.96a.5.5 0 00-.6.22L2.71 8.48a.5.5 0 00.12.64L4.86 10.7c-.04.31-.06.63-.06.94s.02.63.06.94L2.71 14.16a.5.5 0 00-.12.64l1.92 3.32c.14.24.44.34.69.22l2.39-.96c.52.4 1.05.71 1.62.94l.36 2.54c.05.27.28.46.55.46h3c.27 0 .5-.19.55-.46l.36-2.54c.57-.23 1.1-.54 1.62-.94l2.39.96c.25.12.55.02.69-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/></svg>
        </button>
      </div>
    </nav>
  </div>

  <audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

  <script>
    // State
    let redScore = 0, blueScore = 0;
    let redPenalty = 0, bluePenalty = 0;
    let redWins = 0, blueWins = 0;
    let timerInterval = null;
    let currentTimerSeconds = 0;

    // DOM helpers
    const $ = (sel) => document.querySelector(sel);

    function updateScoreDisplays(){
      $('#redScore').textContent = redScore;
      $('#blueScore').textContent = blueScore;
    }
    function updateWinsDisplays(){
      $('#redWins').textContent = redWins;
      $('#blueWins').textContent = blueWins;
    }

    function addScore(team){
      if(team === 'red') redScore++;
      else blueScore++;
      updateScoreDisplays();
    }

    function startMatch(){
      const warmup = 3;
      const matchSeconds = 180;
      clearInterval(timerInterval);
      countdown(warmup, function(){
        runTimer(matchSeconds, function(){
          endMatch();
        });
      });
    }

    function endMatch(){
      const redTotal = redScore + redPenalty;
      const blueTotal = blueScore + bluePenalty;
      if(redTotal > blueTotal){
        redWins++;
        $('#timer').textContent = '紅隊贏得此局！';
      } else if(blueTotal > redTotal){
        blueWins++;
        $('#timer').textContent = '藍隊贏得此局！';
      } else {
        $('#timer').textContent = '此局平手！';
      }
      updateWinsDisplays();
      redScore = 0; blueScore = 0;
      redPenalty = 0; bluePenalty = 0;
      updateScoreDisplays();
    }

    function penalty(team){
      const seconds = 60;
      countdown(seconds, function(){
        if(team === 'red'){ redPenalty++; $('#timer').textContent = '紅隊罰球結束，加分！'; }
        else { bluePenalty++; $('#timer').textContent = '藍隊罰球結束，加分！'; }
      });
    }

    function countdown(seconds, callback){
      clearInterval(timerInterval);
      currentTimerSeconds = seconds;
      timerInterval = setInterval(function(){
        if(currentTimerSeconds >= 0){
          $('#timer').textContent = formatTime(currentTimerSeconds);
        }
        if(currentTimerSeconds <= 10 && currentTimerSeconds > 0){
          playBeep();
        }
        if(currentTimerSeconds <= 0){
          clearInterval(timerInterval);
          timerInterval = null;
          if(typeof callback === 'function') callback();
        }
        currentTimerSeconds--;
      }, 1000);
    }

    function runTimer(seconds, callback){
      clearInterval(timerInterval);
      currentTimerSeconds = seconds;
      timerInterval = setInterval(function(){
        if(currentTimerSeconds >= 0){
          $('#timer').textContent = formatTime(currentTimerSeconds);
        }
        if(currentTimerSeconds <= 10 && currentTimerSeconds > 0){
          playBeep();
        }
        if(currentTimerSeconds <= 0){
          clearInterval(timerInterval);
          timerInterval = null;
          if(typeof callback === 'function') callback();
        }
        currentTimerSeconds--;
      }, 1000);
    }

    function formatTime(sec){
      if(sec < 0) sec = 0;
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      if(sec >= 60) return `${m}:${s < 10 ? '0' : ''}${s}`;
      return `${sec} 秒`;
    }

    function playBeep(){
      const beep = document.getElementById('beep');
      if(beep) beep.play().catch(()=>{});
    }

    function resetMatch(){
      clearInterval(timerInterval);
      timerInterval = null;
      redScore = 0; blueScore = 0;
      redPenalty = 0; bluePenalty = 0;
      $('#redScore').textContent = 0;
      $('#blueScore').textContent = 0;
      $('#timer').textContent = '準備開始';
    }

    function resetTotals(){
      clearInterval(timerInterval);
      timerInterval = null;
      redScore = 0; blueScore = 0;
      redPenalty = 0; bluePenalty = 0;
      redWins = 0; blueWins = 0;
      $('#redScore').textContent = 0;
      $('#blueScore').textContent = 0;
      updateWinsDisplays();
      $('#timer').textContent = '勝局已歸零';
    }

    function resetTeam(team){
      if(team === 'red'){
        redScore = 0; redPenalty = 0;
        $('#redScore').textContent = 0;
      } else {
        blueScore = 0; bluePenalty = 0;
        $('#blueScore').textContent = 0;
      }
    }

    document.addEventListener('DOMContentLoaded', function(){
      $('#redPanel').addEventListener('click', ()=> addScore('red'));
      $('#bluePanel').addEventListener('click', ()=> addScore('blue'));
      $('#redPanel').addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' ') addScore('red'); });
      $('#bluePanel').addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' ') addScore('blue'); });

      $('#btnStart').addEventListener('click', startMatch);
      $('#btnStop').addEventListener('click', function(){ if(timerInterval){ clearInterval(timerInterval); timerInterval = null; } endMatch(); });
      $('#btnResetTotals').addEventListener('click', resetTotals);

      $('#btnPenaltyRed').addEventListener('click', function(){ penalty('red'); });
      $('#btnPenaltyBlue').addEventListener('click', function(){ penalty('blue'); });

      $('#btnResetRed').addEventListener('click', function(){ resetTeam('red'); });
      $('#btnResetBlue').addEventListener('click', function(){ resetTeam('blue'); });

      $('#btnSettings').addEventListener('click', function(){ alert('設定功能尚未實作'); });

      document.addEventListener('keydown', function(e){
        if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        const key = e.key.toLowerCase();
        if(key === 'r') addScore('red');
        if(key === 'b') addScore('blue');
        if(key === 'p') startMatch();
        if(key === 's') { if(timerInterval){ clearInterval(timerInterval); timerInterval = null; } endMatch(); }
      });

      updateScoreDisplays();
      updateWinsDisplays();
      $('#timer').textContent = '準備開始';
    });
  </script>
</body>
</html>
